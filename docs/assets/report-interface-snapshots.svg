      <rect x="112" y="194" width="90" height="32" rx="10" fill="#fff" stroke="#e3e7ef"/><text x="129" y="214" fill="#768196">Transcript</text>
      <rect x="209" y="194" width="75" height="32" rx="10" fill="#fff" stroke="#e3e7ef"/><text x="230" y="214" fill="#768196">Visuals</text>
      <rect x="291" y="194" width="87" height="32" rx="10" fill="#fff" stroke="#e3e7ef"/><text x="312" y="214" fill="#768196">Chapters</text>
      <rect x="385" y="194" width="68" height="32" rx="10" fill="#fff" stroke="#e3e7ef"/><text x="403" y="214" fill="#768196">Study</text>
      <rect x="460" y="194" width="59" height="32" rx="10" fill="#fff" stroke="#e3e7ef"/><text x="469" y="214" fill="#768196">Ask</text>
    </g>
    <rect x="25" y="247" width="490" height="185" rx="15" class="card"/>
    <rect x="43" y="265" width="32" height="32" rx="10" fill="#edf0ff"/><text x="52" y="287" class="sans" font-size="16" fill="#5868d3">✦</text>
    <text x="86" y="280" class="sans ink" font-size="15" font-weight="740">Summary</text><text x="86" y="298" class="sans muted tiny">Generated from the transcript</text>
    <text x="44" y="332" class="sans ink small">The speakers compare solar and wind deployment,</text><text x="44" y="353" class="sans ink small">emphasizing grid storage, community planning and</text><text x="44" y="374" class="sans ink small">long-term lifecycle costs as key decision factors.</text>
    <rect x="43" y="393" width="146" height="23" rx="11" fill="#f2f4ff"/><text x="56" y="409" class="sans tiny" fill="#5966c7">⌚ Source · 12:40–14:10</text>
    <rect x="25" y="448" width="490" height="212" rx="15" class="card"/>
    <text x="44" y="478" class="sans ink" font-size="15" font-weight="740">Ask video</text><text x="44" y="500" class="sans muted tiny">Ask a question about this analysis</text>
    <rect x="43" y="515" width="455" height="40" rx="10" fill="#f8f9fc" stroke="#e1e6ef"/><text x="57" y="540" class="sans muted small">What risks were mentioned?</text>
    <rect x="43" y="570" width="455" height="69" rx="11" fill="#f4f5ff"/><text x="57" y="593" class="sans ink tiny" font-weight="700">ANSWER · WITH SOURCE EXCERPT</text><text x="57" y="614" class="sans ink tiny">Grid stability, storage costs and permitting delays.</text><text x="57" y="631" class="sans" font-size="10" fill="#5b66ca">Source 00:18:24 · “Intermittency requires…”</text>
    <text x="28" y="701" class="sans muted tiny">FIGURE C · REVIEW AND GROUNDED CHAT (ILLUSTRATIVE)</text>
