<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 940" role="img" aria-labelledby="title desc">
  <title id="title">FrameSutra interface illustrations: workspace, processing, and results</title>
  <desc id="desc">Three annotated desktop UI mockups derived from the implemented React screens. They are illustrations, not live screenshots.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f4ff"/><stop offset="1" stop-color="#e5fbf5"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4e65ec"/><stop offset="1" stop-color="#8067e9"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#44cab9"/><stop offset="1" stop-color="#6b91ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#183154" flood-opacity=".12"/></filter>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.ink{fill:#202a3d}.muted{fill:#768196}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.title{font-size:23px;font-weight:750}.card{fill:#fff;stroke:#e4e9f2;stroke-width:1.5}.pill{fill:#f2f5ff;stroke:#e0e5f5}.line{stroke:#e8ecf4;stroke-width:1.5}.btn{fill:url(#blue)}
    </style>
  </defs>
  <rect width="1800" height="940" rx="34" fill="url(#canvas)"/>
  <text x="58" y="64" class="sans ink" font-size="28" font-weight="760">🖥️ FrameSutra · interface view illustrations</text>
  <text x="60" y="94" class="sans muted" font-size="15">Source-derived visual guide for the implemented workspace, progress, and review screens</text>

  <!-- Workspace screen -->
  <g transform="translate(52 130)" filter="url(#shadow)">
    <rect width="540" height="730" rx="22" fill="#f6f8fc" stroke="#dce3f0" stroke-width="2"/>
    <path d="M0 22a22 22 0 0 1 22-22h496a22 22 0 0 1 22 22v44H0Z" fill="#fff"/>
    <circle cx="25" cy="27" r="5" fill="#ff7777"/><circle cx="44" cy="27" r="5" fill="#ffc65d"/><circle cx="63" cy="27" r="5" fill="#5dcc9a"/>
    <text x="84" y="32" class="sans muted small">FrameSutra · Workspace</text>
    <rect x="18" y="82" width="504" height="54" rx="14" fill="#fff" stroke="#e8ecf4"/>
    <rect x="32" y="94" width="30" height="30" rx="10" fill="url(#blue)"/><text x="39" y="114" class="sans" font-size="13" font-weight="800" fill="#fff">FS</text>
    <text x="73" y="105" class="sans ink" font-size="15" font-weight="750">FrameSutra</text><text x="73" y="122" class="sans muted tiny">AI VIDEO UNDERSTANDING</text>
    <rect x="380" y="97" width="126" height="27" rx="14" class="pill"/><text x="394" y="115" class="sans muted tiny">◐ Dark / Light</text>
    <text x="28" y="183" class="sans" font-size="11" font-weight="700" fill="#6272db">LOCAL-FIRST AI · VIDEO INTELLIGENCE · RAG-POWERED</text>
    <text x="28" y="224" class="sans ink" font-size="27" font-weight="780">Every frame has a story.</text>
    <text x="28" y="258" class="sans" font-size="27" font-weight="780" fill="#5d6be5">Every word has an answer.</text>
    <text x="29" y="290" class="sans muted small">Turn recordings into searchable notes, transcripts,</text><text x="29" y="310" class="sans muted small">visual observations and source-grounded answers.</text>
    <rect x="20" y="338" width="500" height="330" rx="18" class="card"/>
    <text x="40" y="373" class="sans ink" font-size="17" font-weight="740">Start an analysis</text>
    <rect x="39" y="391" width="143" height="34" rx="10" fill="#edf0ff"/><text x="60" y="413" class="sans" font-size="12" font-weight="700" fill="#525fca">▶ YouTube link</text>
    <rect x="191" y="391" width="132" height="34" rx="10" fill="#f7f8fb"/><text x="219" y="413" class="sans muted" font-size="12">↑ Upload</text>
    <rect x="332" y="391" width="151" height="34" rx="10" fill="#f7f8fb"/><text x="362" y="413" class="sans muted" font-size="12">▦ Batch sources</text>
    <text x="41" y="458" class="sans muted tiny">YOUTUBE VIDEO URL</text><rect x="39" y="469" width="460" height="43" rx="10" fill="#fff" stroke="#dce2ee"/><text x="54" y="496" class="sans muted small">https://www.youtube.com/watch?v=…</text>
    <text x="41" y="544" class="sans muted tiny">LANGUAGE</text><rect x="39" y="555" width="211" height="38" rx="10" fill="#fff" stroke="#dce2ee"/><text x="54" y="580" class="sans ink small">English</text><text x="226" y="579" class="sans muted small">⌄</text>
    <rect x="265" y="555" width="234" height="38" rx="10" class="btn"/><text x="311" y="580" class="sans" font-size="13" font-weight="700" fill="#fff">Analyze video →</text>
    <rect x="40" y="615" width="13" height="13" rx="3" fill="#fff" stroke="#aeb8cc"/><text x="62" y="626" class="sans muted tiny">I agree to the User Agreement and Privacy Policy</text>
    <text x="28" y="701" class="sans muted tiny">FIGURE A · WORKSPACE (ILLUSTRATIVE)</text>
  </g>

  <!-- Processing screen -->
  <g transform="translate(630 130)" filter="url(#shadow)">
    <rect width="540" height="730" rx="22" fill="#f6f8fc" stroke="#dce3f0" stroke-width="2"/>
    <path d="M0 22a22 22 0 0 1 22-22h496a22 22 0 0 1 22 22v44H0Z" fill="#fff"/>
    <circle cx="25" cy="27" r="5" fill="#ff7777"/><circle cx="44" cy="27" r="5" fill="#ffc65d"/><circle cx="63" cy="27" r="5" fill="#5dcc9a"/>
