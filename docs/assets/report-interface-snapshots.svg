    <rect x="410" y="231" width="85" height="27" rx="14" fill="#e8f8f1"/><text x="426" y="249" class="sans" font-size="11" font-weight="700" fill="#158564">RUNNING</text>
    <text x="30" y="329" class="sans muted small" font-weight="700">3 / 7 pipeline stages complete</text><text x="370" y="329" class="sans muted tiny">Current: Summarize</text>
    <rect x="26" y="350" width="488" height="3" rx="2" fill="#e7eaf2"/><rect x="26" y="350" width="205" height="3" rx="2" fill="url(#teal)"/>
    <g class="sans">
      <rect x="26" y="376" width="488" height="62" rx="13" fill="#fff" stroke="#dcefe7"/><circle cx="52" cy="407" r="14" fill="#e4f7ee"/><text x="47" y="412" font-size="14" font-weight="800" fill="#158564">✓</text><text x="78" y="403" class="ink body" font-weight="700">Prepare audio</text><text x="78" y="422" class="muted tiny">Source validated and converted into audio chunks</text>
      <rect x="26" y="450" width="488" height="62" rx="13" fill="#fff" stroke="#dcefe7"/><circle cx="52" cy="481" r="14" fill="#e4f7ee"/><text x="47" y="486" font-size="14" font-weight="800" fill="#158564">✓</text><text x="78" y="477" class="ink body" font-weight="700">Transcribe speech</text><text x="78" y="496" class="muted tiny">Timestamped transcript checkpoint saved</text>
      <rect x="26" y="524" width="488" height="62" rx="13" fill="#f3f4ff" stroke="#aeb6f1" stroke-width="1.5"/><circle cx="52" cy="555" r="14" fill="#e7e9ff"/><text x="47" y="560" font-size="14" font-weight="800" fill="#5e65d8">3</text><text x="78" y="551" class="ink body" font-weight="700">Summarize key points</text><text x="78" y="570" class="muted tiny">Generating a structured summary</text>
      <rect x="26" y="598" width="488" height="62" rx="13" fill="#fff" stroke="#e4e9f2"/><circle cx="52" cy="629" r="14" fill="#f1f3f7"/><text x="47" y="634" font-size="13" font-weight="700" fill="#8993a6">4</text><text x="78" y="625" class="ink body" font-weight="700">Prepare AI chat</text><text x="78" y="644" class="muted tiny">Build a local index for grounded answers</text>
    </g>
    <text x="28" y="701" class="sans muted tiny">FIGURE B · JOB PROGRESS (ILLUSTRATIVE)</text>
  </g>

  <!-- Results screen -->
  <g transform="translate(1208 130)" filter="url(#shadow)">
    <rect width="540" height="730" rx="22" fill="#f6f8fc" stroke="#dce3f0" stroke-width="2"/>
    <path d="M0 22a22 22 0 0 1 22-22h496a22 22 0 0 1 22 22v44H0Z" fill="#fff"/>
    <circle cx="25" cy="27" r="5" fill="#ff7777"/><circle cx="44" cy="27" r="5" fill="#ffc65d"/><circle cx="63" cy="27" r="5" fill="#5dcc9a"/>
    <text x="84" y="32" class="sans muted small">FrameSutra · Results</text>
